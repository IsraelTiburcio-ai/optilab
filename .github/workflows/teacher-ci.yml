name: Teacher panel emulator checks (no deploy)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  teacher:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        browser: [chromium, webkit]
    env:
      TEACHER_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run typecheck:academic
      - name: Use official Ubuntu browser dependency mirror
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          sources = [Path('/etc/apt/sources.list')]
          sources += list(Path('/etc/apt/sources.list.d').glob('*.list'))
          sources += list(Path('/etc/apt/sources.list.d').glob('*.sources'))
          for source in sources:
              if source.is_file():
                  original = source.read_text()
                  updated = original.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  updated = updated.replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  if updated != original:
                      source.write_text(updated)
          PY
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:sync:production
      - run: npm run test:teacher
