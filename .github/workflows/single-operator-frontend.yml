name: Single operator frontend (explicit owner release)
on:
  workflow_dispatch:
    inputs:
      action:
        description: ON is temporary; OFF is independent recovery after server pause
        required: true
        type: choice
        options: [off, on]
        default: off
      expected_sha:
        description: Exact owner-approved current main commit
        required: true
        type: string
      window_digest:
        description: Exact approved session digest (required for ON only)
        required: false
        type: string
permissions:
  contents: read
  deployments: read
  pages: write
  id-token: write
# Same Pages mutex as deploy.yml. Never cancel a manual OFF recovery. ON is
# refused if a Pages deployment newer than the receipt exists; an ordinary OFF
# queued behind ON runs after it and wins.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SINGLE_OPERATOR_EXPECTED_SHA: ${{ inputs.expected_sha }}
      SINGLE_OPERATOR_DIGEST: ${{ inputs.window_digest }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Load private owner files only for ON
        if: inputs.action == 'on'
        env:
          SESSION: ${{ secrets.SINGLE_OPERATOR_SESSION_JSON }}
          APPROVAL: ${{ secrets.SINGLE_OPERATOR_APPROVAL_JSON }}
          RECEIPT: ${{ secrets.SINGLE_OPERATOR_RECEIPT_JSON }}
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          for(const [key,name] of Object.entries({SESSION:'session',APPROVAL:'approval',RECEIPT:'receipt'})){
            if(!process.env[key])throw Error('Owner release file missing');
            writeFileSync(process.env.RUNNER_TEMP+'/single-'+name+'.json',process.env[key],{mode:0o600,flag:'wx'});
          }
          JS
      - name: Verify owner, current main, exact approval and paused control
        env:
          RELEASE_ACTION: ${{ inputs.action }}
        run: |
          echo "SINGLE_OPERATOR_MAIN_SHA=$(git ls-remote origin refs/heads/main | cut -f1)" >> "$GITHUB_ENV"
          export SINGLE_OPERATOR_MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          node scripts/single-operator-build.mjs --action "$RELEASE_ACTION" --manifest "$RUNNER_TEMP/single-session.json" --approval "$RUNNER_TEMP/single-approval.json" --receipt "$RUNNER_TEMP/single-receipt.json"
      - run: npm run build
      - uses: actions/configure-pages@v5
      - name: Recheck and stamp final artifact (no private fields)
        env:
          RELEASE_ACTION: ${{ inputs.action }}
        run: |
          export SINGLE_OPERATOR_MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          node scripts/single-operator-build.mjs --action "$RELEASE_ACTION" --manifest "$RUNNER_TEMP/single-session.json" --approval "$RUNNER_TEMP/single-approval.json" --receipt "$RUNNER_TEMP/single-receipt.json" --stamp dist/sync-release.json
      - name: Refuse ON after a newer Pages deployment
        if: inputs.action == 'on'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=1" > "$RUNNER_TEMP/latest-pages.json"
          node scripts/single-operator-pages-guard.mjs --latest "$RUNNER_TEMP/latest-pages.json" --receipt "$RUNNER_TEMP/single-receipt.json"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Remove private files
        if: always()
        run: rm -f "$RUNNER_TEMP/single-session.json" "$RUNNER_TEMP/single-approval.json" "$RUNNER_TEMP/single-receipt.json"
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish exact owner-approved artifact
        id: deployment
        uses: actions/deploy-pages@v4
