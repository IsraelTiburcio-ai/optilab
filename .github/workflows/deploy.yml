name: Deploy OptiLab to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# Shared Pages mutex with manual recovery. Never cancel a running OFF/ON release:
# a push queues behind it. The single-operator ON workflow refuses a stale ON
# after a newer completed Pages deployment.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # GitHub Pages has optilab.club configured; Vite must publish at root.
          OPTILAB_PAGES_TARGET: optilab.club
          VITE_SYNC_PILOT: ''
          VITE_INTEGRATED_PROGRESS: general-v1
          VITE_PROGRESS_SYNC: production
          VITE_PROGRESS_SYNC_RELEASE: general-progress-v1
          VITE_PROGRESS_SYNC_PROJECT_ID: optilab-cd829
          VITE_PROGRESS_SYNC_ORIGIN: https://optilab.club
          VITE_ACADEMIC_API_MODE: production
          VITE_ACADEMIC_API_URL: https://optilab-api.vercel.app/api
          VITE_ACADEMIC_APP_ORIGIN: https://optilab.club
          VITE_FIREBASE_AUTH_EMULATOR_URL: ''
          VITE_FIRESTORE_EMULATOR_HOST: ''
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      - run: node scripts/build-production-rules.mjs
      - run: node scripts/write-production-release.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
