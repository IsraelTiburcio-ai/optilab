name: Academic administration emulator checks (no deploy)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  academic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run typecheck:academic
      - run: npm run build
      - run: npm run test:academic
      - run: npm audit --omit=dev
